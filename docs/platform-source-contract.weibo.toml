# Frozen source contract for the discovery-only Weibo integration.
# Registration audit:
#   PYTHONPATH="$PWD/src" "$PWD/.venv/bin/python" \
#     /Users/white/workspace/OpenBiliClaw/scripts/audit_platform_source.py \
#     --contract docs/platform-source-contract.weibo.toml --check --json

schema_version = 1
canonical_slug = "weibo"
display_name = "微博"
integration_level = "discovery-only"
aliases = ["wb", "微博"]
hosts = ["weibo.com", "weibo.cn"]
content_types = ["post"]

[transport]
kind = "private-api"
owner = "backend"
entrypoints = [
  "src/openbiliclaw/sources/weibo_client.py",
  "src/openbiliclaw/sources/weibo.py",
]
route_aliases = []
fallback_owner = "none"
requires_overseas_network = false
routed_by_network_mode = false
network_policy = "A backend-owned httpx client performs direct anonymous reads with trust_env disabled; browser and user credentials are never inherited."

[transport.capability_routes]
discover = "backend:private-api:anonymous-visitor"

[identity]
item_id = "Weibo post id, persisted under the namespaced item key weibo:<post_id>"
url = "Canonical public weibo.com/<uid>/<bid> URL when available, otherwise https://m.weibo.cn/detail/<post_id>"
dedupe = "Canonical source family plus post id; weibo/wb/微博 and declared hosts collapse before persistence"
account_scope = "No user account is claimed; creator mode reads public UID timelines discovered in the same run"

[auth]
mode = "anonymous"
credential_kinds = []
verify_action = "none"
write_path = "none"
account_resolution = "none"
identity_evidence = "No account identity is claimed; the generated visitor SUB is an in-memory anonymous transport detail"
login_cookie_names = []
login_state_path = "none"

[auth.capability_modes]
discover = "anonymous"

[auth.capability_required]
discover = true

[upstream]
success_content_types = [
  "application/json",
  "application/javascript",
  "text/javascript",
  "text/html",
]
pagination = "Public H5 page/cardlistInfo metadata where present; every request and returned page is bounded"
terminal_evidence = "Endpoint-specific status and content-type validation plus a valid JSON/JSONP envelope; empty requires an affirmative zero-total or known empty container"
terminal_policy = "Unknown non-empty cards, total mismatches, challenge HTML, malformed JSON/JSONP, rate limits, and transport failures are degraded or failed, never healthy empty"
partial_policy = "Retain accepted groups, charge only final handoff, and roll back failed or unexecuted keyword claims"
publication_time_policy = "Parse authoritative created_at only, normalize to UTC RFC3339, and leave unknown, invalid, or future values neutral"

[discover]
modes = ["search", "hot", "creator"]
search_generation = "Merged KeywordPlanner and inspiration-axis generation both feed durable Weibo keyword claims; hot terms seed real post search and creator follows same-run authors"
budget = "Independent daily per-mode candidate budgets charged only after global dedupe and final retention"
cursor = "Bounded public H5 page parameters; no durable completeness cursor is claimed"

[profile]
signals = false
incremental = false
refresh_mode = "none"

[extension]
task = "none"
hosts = []
task_marker = false
background = false
early_response = false
cookie_sync = false

[surfaces]
cli = true
setup = false
desktop = true
mobile = true
extension_popup = true
source_status = true
credentials = false
recommendation = true

[surface_scope]
desktop_platform_filter = true
mobile_platform_filter = false
extension_popup_platform_filter = false
platform_filter_policy = "Desktop owns the repository's platform filter and inventory counts. Mobile and extension popup currently expose no per-platform filter for any source, so Weibo is intentionally limited there to canonical badges, text cards, and actions until a shared filter control exists."

[engagement]
view = "mapped"
like = "mapped"
favorite = "unavailable"
comment = "mapped"
share = "mapped"
danmaku = "unavailable"

[media]
image = "proxy"
image_hosts = ["sinaimg.cn"]
deep_link = "browser-fallback"
native_save = false

[e2e]
safe_actions = ["search", "hot", "read-public-profile"]
mutating_actions = []

[e2e.safe_assertions]
search = "upstream-state-unchanged"
hot = "upstream-state-unchanged"
read-public-profile = "upstream-state-unchanged"

[e2e.safe_postconditions]
search = "Only anonymous public GET/POST reads occur; normalized candidates may enter an isolated acceptance database."
hot = "The public hot list is read only as search seeds and no account state is changed."
read-public-profile = "Only a public creator timeline is read; follow, like, save, and other account mutations are absent."

[events]
strategy_prefixes = ["weibo-", "weibo_"]
mappings = "Public posts become discovery candidates; no user behavior or account event is inferred"
scope_caps = "Per-mode budgets and per-keyword limits are backend-owned and charged after final retention"

[task]
lease = "Durable discovery keyword claims use the shared coordinator; no extension task lease exists"
idle_deadline = "Backend HTTP requests use bounded transport timeouts"
absolute_deadline = "Per-mode budgets, keyword limits, and bounded retries cap each producer run"
retry = "Transient fetch, normalization, and enqueue failures roll back unaccepted claims; accepted partial groups remain used"
buffer = "No extension response buffer exists; visitor SUB remains in process memory only"

[smoke]
storage_scope = "isolated-only"

[smoke.sinks]
task = "forbidden"
task_result = "forbidden"
seen = "forbidden"
affinity = "forbidden"
snapshot = "forbidden"
schedule = "forbidden"
event_ingress = "forbidden"
memory = "forbidden"
profile = "forbidden"

[exclusions]
"profile.signals" = "Weibo is discovery-only and does not import account or behavior signals into the profile."
"profile.incremental" = "No profile signals exist to refresh incrementally."
"profile.refresh-mode" = "No profile refresh path is claimed."
"extension.task" = "Discovery is backend-owned; the extension never opens or owns a Weibo task."
"extension.task-marker" = "No extension task exists, so no task marker is injected."
"extension.background" = "No Weibo background or service-worker capability is registered."
"extension.early-response" = "No browser response capture or replay is used."
"extension.cookie-sync" = "Anonymous discovery never reads or writes browser Cookie values."
"surface.setup" = "Discovery-only Weibo is explicitly excluded from guided profile initialization."
"surface.credentials" = "Weibo accepts no user credential and only exposes anonymous source health."
"engagement.favorite" = "The selected public post schema exposes no trustworthy favorite count."
"engagement.danmaku" = "Weibo has no Bilibili-style danmaku metric."
"media.deep-link" = "No reliable official Weibo native URL scheme is claimed; mobile opens the canonical web URL."
"media.native-save" = "The source is read-only; OpenBiliClaw membership remains local and no platform mutation adapter is claimed."

[exclusion_tests]
"profile.signals" = ["tests/test_weibo_contract.py::test_weibo_profile_signals_are_discovery_only"]
"profile.incremental" = ["tests/test_weibo_contract.py::test_weibo_profile_incremental_is_excluded"]
"profile.refresh-mode" = ["tests/test_weibo_contract.py::test_weibo_profile_refresh_mode_is_none"]
"extension.task" = ["tests/test_weibo_contract.py::test_weibo_extension_task_is_excluded"]
"extension.task-marker" = ["tests/test_weibo_contract.py::test_weibo_extension_task_marker_is_excluded"]
"extension.background" = ["tests/test_weibo_contract.py::test_weibo_extension_background_is_excluded"]
"extension.early-response" = ["tests/test_weibo_contract.py::test_weibo_extension_early_response_is_excluded"]
"extension.cookie-sync" = ["tests/test_weibo_contract.py::test_weibo_extension_cookie_sync_is_excluded"]
"surface.setup" = ["tests/test_weibo_contract.py::test_weibo_setup_surface_is_excluded"]
"surface.credentials" = ["tests/test_weibo_contract.py::test_weibo_credentials_surface_is_excluded"]
"engagement.favorite" = ["tests/test_weibo_contract.py::test_weibo_favorite_engagement_is_unavailable"]
"engagement.danmaku" = ["tests/test_weibo_contract.py::test_weibo_danmaku_engagement_is_unavailable"]
"media.deep-link" = ["tests/test_weibo_contract.py::test_weibo_deep_link_uses_browser_fallback"]
"media.native-save" = ["tests/test_weibo_contract.py::test_weibo_native_save_is_excluded"]
