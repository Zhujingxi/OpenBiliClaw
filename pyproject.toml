[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbiliclaw"
version = "0.3.201"
description = "Your local-first, cross-platform AI discovery friend for Bilibili, Zhihu, and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "OpenBiliClaw Contributors" },
]
keywords = ["bilibili", "zhihu", "ai", "agent", "recommendation", "content-discovery", "cross-platform", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "httpx[socks]>=0.27",
    "fastapi>=0.115",
    "rich>=13",
    "typer>=0.12",
    "pydantic>=2.0",
    "uvicorn>=0.32",
    "pydantic-ai-slim[anthropic,google,openai,openrouter]==1.56.0",
    # pydantic-ai 1.56 imports an Anthropic type removed in 0.80.
    "anthropic>=0.78,<0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.8",
    "mypy>=1.13",
]
local-llm = [
    "ollama>=0.4",
]
browser = [
    "playwright>=1.40",
]
tls = [
    "cryptography>=41",
]
packaging = [
    # Desktop installer builds (packaging/build.py). Bundles the backend into a
    # macOS .app/.dmg or Windows onedir for the Inno Setup installer.
    "pyinstaller>=6.11",
    # System-tray desktop mode (packaging/entry.py): tray icon + menu so the app
    # runs without a console window — Windows system tray and macOS menu bar.
    "pystray>=0.19",
    # pystray's macOS backend needs pyobjc (Foundation / AppKit / Quartz).
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
openbiliclaw = "openbiliclaw.composition.entrypoints:main"

[project.urls]
Homepage = "https://github.com/whiteguo233/OpenBiliClaw"
Repository = "https://github.com/whiteguo233/OpenBiliClaw"
Issues = "https://github.com/whiteguo233/OpenBiliClaw/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openbiliclaw"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PGH003", # require error codes on type: ignore
    "PGH004", # require error codes on noqa
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501", "TC001", "TC002", "TC003", "TC004"]  # Executable scripts use runtime annotations and contain long prompt strings.
"src/openbiliclaw/hosts/**/*.py" = ["B008", "TC001", "TC002", "TC003", "TC004"]  # FastAPI inspects runtime annotations and dependency defaults.
"tests/hosts/**/*.py" = ["TC001", "TC002", "TC003", "TC004"]  # Runtime DTO aliases are exercised by host contract tests.
"tests/application/test_workflows.py" = ["TC001"]  # Pydantic form type is required at runtime in workflow contract tests.

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_explicit = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aiohttp",
    "playwright.*",
]
ignore_missing_imports = true

# Legacy tests retain explicit Any until their modules migrate; refactored tests stay enforced.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_explicit = false

# Legacy utility scripts remain cutover debt; the new host scripts are checked strictly below.
[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scripts.export_openapi", "scripts.generate_api_client"]
ignore_errors = false

[[tool.mypy.overrides]]
module = [
    "tests.access.*",
    "tests.ai.*",
    "tests.assistant.*",
    "tests.application.*",
    "tests.content.*",
    "tests.core.*",
    "tests.infrastructure.*",
    "tests.hosts.*",
    "tests.observations.*",
    "tests.understanding.*",
]
disallow_any_explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: real Bilibili API checks that require local credentials",
]
