# OpenBiliClaw from the prebuilt multi-arch backend image.
# Set OPENBILICLAW_MODEL_KEY_FILE to a protected host file before first start.

services:
  embedding:
    build:
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PIP_NO_CACHE_DIR=1 PYTHONUNBUFFERED=1
        RUN pip install 'infinity_emb[torch,server]==0.0.77' \
            && pip install --no-deps 'typer>=0.16,<1'
        EXPOSE 7997
        ENTRYPOINT ["infinity_emb"]
        CMD ["v2", "--model-id", "BAAI/bge-small-zh-v1.5", "--port", "7997", "--no-bettertransformer"]
    environment:
      HF_HOME: /models
    volumes:
      - embedding_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 5m
      retries: 6
    restart: unless-stopped

  openbiliclaw-backend:
    image: ghcr.io/whiteguo233/openbiliclaw-backend:latest
    depends_on:
      embedding:
        condition: service_healthy
    environment:
      OPENBILICLAW_RUNTIME_DIR: /app/runtime
      OPENBILICLAW_CONFIG_TEMPLATE: /app/config.docker.toml
      OPENBILICLAW_MODEL_KEY_FILE: /run/secrets/model_api_key
    secrets:
      - model_api_key
    ports:
      - "${OPENBILICLAW_API_PORT:-8420}:8420"
    volumes:
      - openbiliclaw_config:/app/runtime
      - openbiliclaw_data:/app/runtime/data
      - openbiliclaw_logs:/app/runtime/logs
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

secrets:
  model_api_key:
    file: ${OPENBILICLAW_MODEL_KEY_FILE:-./model_api_key.txt}

volumes:
  embedding_models:
  openbiliclaw_config:
  openbiliclaw_data:
  openbiliclaw_logs:
