# Docker runtime template. docker/seed-runtime.py writes the usable config.toml
# into the persistent runtime volume and replaces this opaque-reference token.

[model]
# models.dev catalog id; endpoint/protocol/capabilities resolve from the
# catalog (Anthropic-protocol coding endpoint, thinking enabled).
provider = "kimi-for-coding"
model_name = "kimi-for-coding"
secret_ref = "vault:DOCKER_MODEL_SECRET_REF"

[embedding]
provider = "openai"
model_name = "BAAI/bge-small-zh-v1.5"
endpoint = "http://embedding:7997"
secret_ref = "vault:DOCKER_MODEL_SECRET_REF"
output_dimensions = 512

[content]
enabled = ["bilibili", "youtube", "bangumi", "v2ex", "hackernews", "weibo"]

[recommendation]
pool_target_count = 100

[host]
api_host = "0.0.0.0"
api_port = 8420
bearer_secret_ref = "vault:DOCKER_BEARER_SECRET_REF"
# Trusted-LAN alternative to the bearer above: remove bearer_secret_ref and set
# allow_unauthenticated = true. Anyone who can reach the port then has full
# read/write API access — use only on networks you trust.
# allow_unauthenticated = true
# Serving the SPA at a LAN address also needs its Origin allowlisted:
# allowed_origins = ["http://192.168.1.20:8420"]

[runtime]
default_timeout_seconds = 120.0
default_resource_limit = 2
