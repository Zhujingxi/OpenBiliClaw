name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      expensive_tests:
        description: "Run Windows and Playwright smoke tests"
        required: false
        type: boolean
        default: false

jobs:
  windows-autostart-e2e:
    name: Windows HKCU autostart E2E
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.expensive_tests }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and pytest
        run: python -m pip install -e . "pytest>=8"

      - name: Exercise real HKCU Run and process launch
        run: python -m pytest -q tests/composition/test_composition.py -k entrypoint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src/ tests/

      - name: Run MyPy
        run: python -m mypy src/ tests/

      - name: Run pytest
        env:
          ALLOW_MODEL_REQUESTS: "False"
        run: python -m pytest --cov=openbiliclaw --cov-branch

  frontend:
    name: Target frontend gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check formatting
        run: npm run format:check
        working-directory: frontend

      - name: Lint and reject handwritten JavaScript
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend

      - name: Build all workspaces
        run: npm run build
        working-directory: frontend

  extension-firefox-build:
    name: Smoke-build Firefox extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install extension dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Firefox extension
        run: |
          npm run build --workspace @openbiliclaw/extension
          python ../scripts/extension_release.py package --firefox --no-build
        working-directory: frontend

      - name: Verify packaged Firefox manifest
        shell: bash
        run: |
          test -f artifacts/extension/firefox/manifest.json
          # Confirm version was injected from manifest.json
          chrome_version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('extension/manifest.json','utf-8')).version)")
          firefox_version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/extension/firefox/manifest.json','utf-8')).version)")
          if [ "$chrome_version" != "$firefox_version" ]; then
            echo "version mismatch: manifest.json=$chrome_version vs packaged Firefox manifest=$firefox_version"
            exit 1
          fi
          echo "Firefox manifest version $firefox_version matches manifest.json"

  target-web-host-smoke:
    name: Target web host smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.expensive_tests }}
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev,browser]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Sanitize apt sources for Playwright
        shell: bash
        run: |
          sudo find /etc/apt/sources.list.d -type f \
            \( -name "*microsoft*" -o -name "*azure-cli*" \) \
            -print -delete || true
          sudo grep -rlE 'packages\.microsoft\.com|azure-cli' /etc/apt/sources.list.d 2>/dev/null \
            | xargs -r sudo rm -f || true
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i.bak '/packages\.microsoft\.com/d;/azure-cli/d' /etc/apt/sources.list
          fi

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run target host API smoke
        run: python -m pytest -q tests/hosts/test_api.py
