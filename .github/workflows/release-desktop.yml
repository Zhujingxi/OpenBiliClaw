name: Release Desktop Installers

# Tag-triggered auto-publish. Push a `desktop-v*` tag (e.g. `desktop-v0.3.102`)
# and this builds the macOS (.dmg) + Windows (.exe) installers and publishes them
# to a GitHub *pre-release* (the app is unsigned / pre-alpha). This is the
# auto-publish counterpart to build-installers.yml (manual, artifacts-only).
#
# Scope note: the backend SOURCE stays source-only (`backend-v*` tags are git
# markers, no Release) — only the desktop installer BINARIES ship here.
#
# Arch note: only macOS arm64 + Windows x64 are auto-built. The macos-13 (Intel
# x64) runner is scarce and routinely queues for a very long time; gating every
# release on it would stall the whole publish. Build the Intel .dmg on demand via
# the manual build-installers.yml and attach it to the release if needed.
on:
  push:
    tags:
      - "desktop-v*"

# Needs write access to publish the Release (build-installers.yml stays read-only).
permissions:
  contents: write

jobs:
  macos:
    name: macOS installer (.dmg, arm64, ${{ matrix.variant }})
    runs-on: macos-14 # Apple Silicon
    strategy:
      # fail-fast off so a failing variant doesn't cancel the other.
      fail-fast: false
      matrix:
        variant: [lean]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web frontend artifact
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build --workspace @openbiliclaw/web

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # [packaging] pulls pyinstaller + pystray + Pillow + pyobjc (menu-bar tray).
          pip install -e ".[packaging]" "pytest>=8"

      - name: Run macOS installer handoff E2E
        run: python -m pytest -q tests/test_macos_installer_e2e.py

      - name: Resolve version
        id: ver
        run: |
          # desktop-v0.3.102 -> v0.3.102 (a tagged release IS the version; no SHA stamp).
          v="${GITHUB_REF_NAME#desktop-}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build .app + .dmg
        run: |
          python packaging/build.py --clean --archive-version "${{ steps.ver.outputs.version }}-arm64"

      - name: Enforce GitHub asset size limit (< 2GB)
        run: |
          for f in dist/release/*.dmg dist/release/*.zip; do
            [ -e "$f" ] || continue
            sz=$(stat -f%z "$f")
            printf '%s = %s MiB\n' "$f" "$((sz / 1024 / 1024))"
            [ "$sz" -le 2147483648 ] || { echo "ERROR: $f exceeds GitHub's 2GB asset limit"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: openbiliclaw-macos-installer-arm64-${{ matrix.variant }}
          path: |
            dist/release/*.dmg
            dist/release/*.zip
          if-no-files-found: error

  windows:
    name: Windows installer (.exe, ${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [lean]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web frontend artifact
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build --workspace @openbiliclaw/web

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # [packaging] pulls pyinstaller + pystray + Pillow (tray desktop mode).
          pip install -e ".[packaging]" "pytest>=8"

      - name: Run real Windows HKCU autostart E2E
        run: python -m pytest -q tests/composition/test_composition.py -k entrypoint

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#desktop-}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "bare=${v#v}" >> "$GITHUB_OUTPUT"
          numeric="$(python -c 'import re,sys; m=re.match(r"v?(\d+)\.(\d+)\.(\d+)", sys.argv[1]); print(f"{m.group(1)}.{m.group(2)}.{m.group(3)}.0" if m else "0.0.0.0")' "$v")"
          echo "version_info=$numeric" >> "$GITHUB_OUTPUT"
          echo "variant_suffix=" >> "$GITHUB_OUTPUT"

      - name: PyInstaller onedir build
        shell: pwsh
        run: |
          # Build the arg list as an array so the lean variant never passes an
          # empty-string argument (argparse rejects "" as an unrecognized arg).
          $buildArgs = @("--clean", "--archive-version", "${{ steps.ver.outputs.version }}")
          python packaging/build.py @buildArgs

      - name: Run real frozen-bundle autostart lifecycle E2E
        if: matrix.variant == 'lean'
        shell: pwsh
        run: |
          $env:OPENBILICLAW_FROZEN_EXE = (Resolve-Path "dist\OpenBiliClaw\OpenBiliClaw.exe").Path
          python -m pytest -q tests/composition/test_composition.py -k entrypoint

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.bare }} /DMyAppVersionInfoVersion=${{ steps.ver.outputs.version_info }} /DMyAppVariantSuffix=${{ steps.ver.outputs.variant_suffix }} packaging\openbiliclaw.iss

      - name: Install and test the actual Windows installer
        if: matrix.variant == 'lean'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "dist\release\*.exe" | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP "OpenBiliClaw-installed"
          $env:OPENBILICLAW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "OpenBiliClaw-installer-bootstrap"
          $env:OPENBILICLAW_SELFTEST = "1"
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          Get-Process -Name OpenBiliClaw -ErrorAction SilentlyContinue |
            Wait-Process -Timeout 180 -ErrorAction Stop
          $env:OPENBILICLAW_FROZEN_EXE = (Resolve-Path "$installDir\OpenBiliClaw.exe").Path
          python -m pytest -q tests/composition/test_composition.py -k entrypoint

      - name: Enforce GitHub asset size limit (< 2GB)
        shell: pwsh
        run: |
          Get-ChildItem dist\release\*.exe | ForEach-Object {
            $mib = [math]::Round($_.Length / 1MB)
            Write-Host "$($_.Name) = $mib MiB"
            if ($_.Length -gt 2147483648) { throw "$($_.Name) exceeds GitHub's 2GB asset limit" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: openbiliclaw-windows-installer-${{ matrix.variant }}
          path: dist/release/*.exe
          if-no-files-found: error

  publish:
    name: Publish desktop pre-release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    # always() so a single failed build leg still ships the other installer
    # rather than blocking the whole release.
    if: ${{ always() }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download built installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: openbiliclaw-*
          merge-multiple: true

      - name: List downloaded installers
        run: ls -lhR release-artifacts || true

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'EOF'
          **实验性桌面安装包**（未签名 / 未公证，仅供尝鲜）。macOS DMG 内已放入一键安装并启动助手与首次打开说明；后端源码仍为 source-only，此处只发桌面应用二进制。

          ### macOS 安全阻挡
          - 当前 Release 是 ad-hoc signed、未 notarized。打开 DMG 后推荐双击 `安装并启动 Install OpenBiliClaw.command`，它会校验新包、退出旧实例、原子替换 `/Applications/OpenBiliClaw.app` 并启动刚安装的版本；传统拖拽仍可用，但升级需手动退出和重开。
          - 首次运行安装助手或应用被拦截时，右键 / Control-click 对应项目 →「打开」→ 在弹窗里再点「打开」；或到「System Settings → Privacy & Security」点「Open Anyway / 仍要打开」。
          - 若提示“OpenBiliClaw.app 已损坏，无法打开”，通常是下载隔离属性导致。确认包来源可信后执行：`APP="/Applications/OpenBiliClaw.app"; xattr -dr com.apple.quarantine "$APP"`，然后再次打开应用。
          - **Windows**：SmartScreen 弹窗点「更多信息 → 仍要运行」。

          常驻 macOS 菜单栏 / Windows 系统托盘。数据在 `~/OpenBiliClaw`（macOS / Linux）/ `%USERPROFILE%\OpenBiliClaw`（Windows），升级 / 卸载不动它。Intel mac（x64）.dmg 未自动构建，需要时用手动的 build-installers.yml 产出后补挂。
          EOF

          ensure_release() {
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes-file "$notes_file"
              return
            fi

            for attempt in 1 2 3; do
              if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --notes-file "$notes_file"; then
                return
              fi
              if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes-file "$notes_file"
                return
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }

          ensure_release
          shopt -s nullglob
          assets=(release-artifacts/*.dmg release-artifacts/*.exe)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installer assets found"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done

      - name: Update aggregate latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHANNEL: desktop
          ASSET_GLOBS: release-artifacts/*.dmg release-artifacts/*.exe
        run: bash .github/scripts/sync-aggregate-release.sh
