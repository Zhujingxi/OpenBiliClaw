name: Build Desktop Installers

# Manual-only. Produces downloadable Actions ARTIFACTS (macOS arm64 + Intel .dmg
# / Windows .exe). This workflow itself does NOT create a GitHub Release and is
# NOT triggered by any tag push (read-only token below). The backend SOURCE stays
# "source-only" (backend-v* tags are git markers, no Release).
#
# For an actual published Release, push a `desktop-v*` tag → release-desktop.yml
# auto-builds (arm64 + Windows) and publishes an experimental pre-release. This
# manual workflow stays for ad-hoc builds — notably the Intel x64 .dmg, which
# release-desktop.yml skips to avoid gating releases on a second macOS build.
# Build it here on demand and attach it to the release if needed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact filenames (e.g. v0.3.101). Defaults to pyproject version."
        required: false
        default: ""
      windows_only:
        description: "Skip both macOS jobs and build/test only the Windows installer."
        required: false
        type: boolean
        default: false

# Read-only token: this workflow structurally cannot publish a Release.
permissions:
  contents: read

jobs:
  macos:
    name: macOS installer (.dmg, ${{ matrix.arch }})
    if: ${{ inputs.windows_only != true }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native per-arch builds keep platform-specific wheels aligned.
          - { runner: macos-14, arch: arm64 } # Apple Silicon
          - { runner: macos-15-intel, arch: x64 } # Intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web frontend artifact
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build --workspace @openbiliclaw/web

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # [packaging] pulls pyinstaller + pystray + Pillow + (on macOS) pyobjc
          # for the menu-bar tray desktop mode.
          pip install -e ".[packaging]" "pytest>=8"

      - name: Run macOS installer handoff E2E
        run: python -m pytest -q tests/test_macos_installer_e2e.py

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else
            v="v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          fi
          # Stamp the commit SHA so every build is uniquely identifiable — the
          # installed app / .dmg name shows exactly which code it contains.
          v="${v}.${GITHUB_SHA:0:7}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build .app + .dmg
        run: python packaging/build.py --clean --archive-version "${{ steps.ver.outputs.version }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: openbiliclaw-macos-installer-${{ matrix.arch }}
          path: |
            dist/release/*.dmg
            dist/release/*.zip
          if-no-files-found: error

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web frontend artifact
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build --workspace @openbiliclaw/web

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # [packaging] pulls pyinstaller + pystray + Pillow (tray desktop mode).
          pip install -e ".[packaging]" "pytest>=8"

      - name: Run real Windows HKCU autostart E2E
        run: python -m pytest -q tests/composition/test_composition.py -k entrypoint

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else
            v="v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          fi
          # Stamp the commit SHA so the installed app's version (Programs &
          # Features) shows exactly which code it contains — no more guessing.
          v="${v}.${GITHUB_SHA:0:7}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "bare=${v#v}" >> "$GITHUB_OUTPUT"
          numeric="$(python -c 'import re,sys; m=re.match(r"v?(\d+)\.(\d+)\.(\d+)", sys.argv[1]); print(f"{m.group(1)}.{m.group(2)}.{m.group(3)}.0" if m else "0.0.0.0")' "$v")"
          echo "version_info=$numeric" >> "$GITHUB_OUTPUT"

      - name: PyInstaller onedir build
        run: python packaging/build.py --clean --archive-version "${{ steps.ver.outputs.version }}"

      - name: Run real frozen-bundle autostart lifecycle E2E
        shell: pwsh
        run: |
          $env:OPENBILICLAW_FROZEN_EXE = (Resolve-Path "dist\OpenBiliClaw\OpenBiliClaw.exe").Path
          python -m pytest -q tests/composition/test_composition.py -k entrypoint

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.bare }} /DMyAppVersionInfoVersion=${{ steps.ver.outputs.version_info }} packaging\openbiliclaw.iss

      - name: Install and test the actual Windows installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "dist\release\*.exe" | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP "OpenBiliClaw-installed"
          $env:OPENBILICLAW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "OpenBiliClaw-installer-bootstrap"
          $env:OPENBILICLAW_SELFTEST = "1"
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          Get-Process -Name OpenBiliClaw -ErrorAction SilentlyContinue |
            Wait-Process -Timeout 180 -ErrorAction Stop
          $env:OPENBILICLAW_FROZEN_EXE = (Resolve-Path "$installDir\OpenBiliClaw.exe").Path
          python -m pytest -q tests/composition/test_composition.py -k entrypoint

      - uses: actions/upload-artifact@v7
        with:
          name: openbiliclaw-windows-installer
          path: dist/release/*.exe
          if-no-files-found: error
