<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3F5"/>
      <stop offset="0.52" stop-color="#FFF9F3"/>
      <stop offset="1" stop-color="#EDF4FF"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0F4"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#625A70" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="url(#bg)"/>

  <rect x="68" y="62" width="64" height="64" rx="18" fill="#24304A"/>
  <text x="100" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">B</text>
  <text x="158" y="103" font-family="Arial, Hiragino Sans GB, sans-serif" font-size="33" font-weight="700" fill="#24304A">OpenBiliClaw</text>
  <text x="948" y="103" text-anchor="end" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69758E">01 / 03</text>

  <rect x="68" y="180" width="302" height="56" rx="28" fill="#FFFFFF" stroke="#F0DDE2" stroke-width="2"/>
  <text x="219" y="217" text-anchor="middle" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="25" font-weight="600" fill="#A54863">关于更好的推荐</text>

  <text x="68" y="344" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="66" font-weight="700" fill="#202635">更好的内容推荐，</text>
  <text x="68" y="436" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="66" font-weight="700" fill="#202635">不是喂给你更多。</text>

  <g filter="url(#shadow)">
    <rect x="58" y="510" width="964" height="380" rx="54" fill="url(#agent)" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <circle cx="900" cy="616" r="108" fill="#F7C9D7" opacity="0.34"/>
  <circle cx="846" cy="712" r="140" fill="#BFD2FF" opacity="0.30"/>
  <text x="104" y="604" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="39" font-weight="600" fill="#6C7383">而是有一个</text>
  <text x="104" y="704" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="72" font-weight="700" fill="#202635">真正懂你的 Agent</text>
  <rect x="98" y="742" width="472" height="16" rx="8" fill="#FFD46A" opacity="0.9"/>
  <text x="104" y="832" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="50" font-weight="600" fill="#39445B">替你去寻找。</text>

  <g font-family="Hiragino Sans GB, Heiti SC, sans-serif">
    <rect x="68" y="952" width="284" height="168" rx="34" fill="#FFFFFF" stroke="#F1E3E6" stroke-width="2"/>
    <text x="100" y="1004" font-size="22" font-weight="700" fill="#D34F76">01</text>
    <text x="100" y="1054" font-size="31" font-weight="700" fill="#263047">你明确想要的</text>
    <text x="100" y="1094" font-size="22" fill="#69758E">已经知道自己在找什么</text>

    <rect x="398" y="952" width="284" height="168" rx="34" fill="#FFFFFF" stroke="#F1E3E6" stroke-width="2"/>
    <text x="430" y="1004" font-size="22" font-weight="700" fill="#D8992A">02</text>
    <text x="430" y="1054" font-size="31" font-weight="700" fill="#263047">你此刻需要的</text>
    <text x="430" y="1094" font-size="22" fill="#69758E">不一定上瘾，但真正有用</text>

    <rect x="728" y="952" width="284" height="168" rx="34" fill="#FFFFFF" stroke="#F1E3E6" stroke-width="2"/>
    <text x="760" y="1004" font-size="22" font-weight="700" fill="#5482D8">03</text>
    <text x="760" y="1054" font-size="31" font-weight="700" fill="#263047">你尚未发现的</text>
    <text x="760" y="1094" font-size="22" fill="#69758E">潜在兴趣与意外惊喜</text>
  </g>

  <text x="540" y="1226" text-anchor="middle" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="39" font-weight="700" fill="#28334A">找到已知，也探索未知。</text>
  <text x="540" y="1280" text-anchor="middle" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="27" fill="#69758E">它理解的不是一次点击，而是不断变化的你。</text>

  <rect x="246" y="1340" width="588" height="64" rx="32" fill="#24304A"/>
  <text x="540" y="1382" text-anchor="middle" font-family="Arial, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">OpenBiliClaw · 开源个人内容发现 Agent</text>
</svg>
