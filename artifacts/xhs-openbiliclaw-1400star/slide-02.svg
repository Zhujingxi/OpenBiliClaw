<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4F6"/>
      <stop offset="0.55" stop-color="#FFFAF4"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <clipPath id="screenClip"><rect x="76" y="554" width="928" height="580" rx="34"/></clipPath>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#625A70" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="url(#bg2)"/>
  <rect x="68" y="62" width="64" height="64" rx="18" fill="#24304A"/>
  <text x="100" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">B</text>
  <text x="158" y="103" font-family="Arial, Hiragino Sans GB, sans-serif" font-size="33" font-weight="700" fill="#24304A">OpenBiliClaw</text>
  <text x="948" y="103" text-anchor="end" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69758E">02 / 03</text>

  <text x="68" y="240" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="58" font-weight="700" fill="#202635">“懂你”，不只是记住</text>
  <text x="68" y="318" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="58" font-weight="700" fill="#202635">你点过什么。</text>

  <text x="68" y="404" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="30" fill="#59657A">而是把浏览、喜欢、收藏和对话，变成一份</text>
  <text x="68" y="451" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="30" fill="#59657A">持续更新的个人画像，再带着这份理解主动寻找。</text>

  <g filter="url(#shadow2)">
    <rect x="60" y="538" width="960" height="612" rx="46" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#screenClip)">
    <rect x="76" y="554" width="928" height="580" fill="#F7F5F0"/>
  </g>

  <g font-family="Hiragino Sans GB, Heiti SC, sans-serif">
    <rect x="68" y="1208" width="284" height="108" rx="30" fill="#FFF0F4" stroke="#F5D9E1"/>
    <text x="210" y="1254" text-anchor="middle" font-size="27" font-weight="700" fill="#A13E5C">你说出口的需要</text>
    <text x="210" y="1292" text-anchor="middle" font-size="21" fill="#725D65">明确表达</text>

    <rect x="398" y="1208" width="284" height="108" rx="30" fill="#FFF7E7" stroke="#F2E2B8"/>
    <text x="540" y="1254" text-anchor="middle" font-size="27" font-weight="700" fill="#90681C">行为透露的偏好</text>
    <text x="540" y="1292" text-anchor="middle" font-size="21" fill="#726447">持续理解</text>

    <rect x="728" y="1208" width="284" height="108" rx="30" fill="#EEF4FF" stroke="#D6E2FA"/>
    <text x="870" y="1254" text-anchor="middle" font-size="27" font-weight="700" fill="#416DAE">尚未发现的兴趣</text>
    <text x="870" y="1292" text-anchor="middle" font-size="21" fill="#586B89">主动探索</text>
  </g>

  <text x="540" y="1384" text-anchor="middle" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="29" font-weight="600" fill="#516079">画像不是结论，而是下一次寻找的起点。</text>
</svg>
