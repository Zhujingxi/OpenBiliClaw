    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6E9A"/><stop offset="1" stop-color="#7AA7FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#6A5A5A" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <circle cx="87" cy="92" r="8" fill="#FF6E9A"/>
