  <text x="132" y="1168" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="27" fill="#687188">画像可以手动编辑，也会随着新的反馈持续更新。</text>
  <text x="540" y="1372" text-anchor="middle" font-family="Arial, Hiragino Sans GB, sans-serif" font-size="23" fill="#7D8494">SIGNALS → PROFILE → MEMORY → EVOLVE</text>
