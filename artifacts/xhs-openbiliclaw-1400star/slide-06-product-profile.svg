  <rect x="402" y="138" width="276" height="58" rx="12" fill="url(#tape)" opacity="0.86" transform="rotate(-2 540 167)"/>

  <text x="120" y="310" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="61" font-weight="650" fill="#171A22">它不只记住兴趣标签</text>
