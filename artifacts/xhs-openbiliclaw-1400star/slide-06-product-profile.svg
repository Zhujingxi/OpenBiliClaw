    <rect x="132" y="1032" width="184" height="62" rx="31" fill="#FDE7EE"/><text x="172" y="1072" fill="#D84E76">人格素描</text>
    <rect x="332" y="1032" width="184" height="62" rx="31" fill="#E7F0FD"/><text x="372" y="1072" fill="#4979B8">核心特质</text>
